worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;
        server_name localhost;

        # build de Angular
        root C:/Users/emiba/Desktop/clinicaTp-final/frontend/dist/frontend/browser;
        index index.csr.html;

        # cualquier ruta de Angular devuelve la página principal
        location / {
            try_files $uri $uri/ /index.csr.html;
        }

        # lo que empieza con /api se manda al backend (sin el prefijo /api)
        location /api/ {
            proxy_pass http://localhost:3000/;
        }
    }
}